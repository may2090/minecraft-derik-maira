<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft: Dérik e Maíra</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>⛏️ Minecraft: Dérik e Maíra 💚</h1>
    <p>Uma aventura de amor em um mundo de blocos!</p>
  </header>

  <main>
    <div class="hud">
      ❤️ Corações: <span id="score">0</span>/10
      <span id="status">Encontre os corações!</span>
    </div>

    <canvas id="game" width="900" height="500" aria-label="Jogo de plataforma Dérik e Maíra"></canvas>

    <div class="controls">
      <button id="left" aria-label="Andar para esquerda">⬅️</button>
      <button id="jump">⬆️ PULAR</button>
      <button id="right" aria-label="Andar para direita">➡️</button>
      <button id="restart">🔄 Reiniciar</button>
    </div>

    <p class="instructions">
      Computador: use A/D ou as setas para andar e espaço para pular.<br>
      Celular: use os botões para controlar o personagem.
    </p>
  </main>
  <script src="script.js"></script>
</body>
</html>
